name: Debian packages

# Rolling release: every push to main tests, builds nfsroot-watchdog and
# nfsroot-watchdog-server for each suite, and republishes a signed apt
# repository per suite on GitHub Pages
# (https://fpgas.online/nfsroot-watchdog/<suite>/). Both packages are
# Architecture: all (shell and Python), so one x86 build per suite serves
# every architecture. A pull request runs the same tests and builds, and
# publishes nothing. Versions come from git (apt-repo-action's shared
# scripts/deb-version.py, run by its build-deb action).
#
# This follows mithro/apt-repo-action's docs/packaging.md; the differences
# from its defaults are declared in .github/apt-packaging.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  # A newer push to a pull request cancels the older build. On the default
  # branch a running publish is never cancelled: the newest push waits for it,
  # and replaces any older push still waiting (it contains that one's commits).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The clients run whatever busybox their root's suite has: bookworm's
    # 1.35 (Raspberry Pi OS), trixie's 1.37 and forky's 1.38 all have to
    # work. (sid has forky's.)
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, forky]
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: |
          apt-get update
          # busybox: the dynamic, non-standalone build the logic tests fake
          # applets around. busybox-static conflicts with it, so unpack
          # that one for the smoke test instead of installing it.
          apt-get install -y --no-install-recommends busybox python3 python3-pytest shellcheck
          cd /tmp && apt-get download busybox-static && dpkg-deb -x busybox-static_*.deb /tmp/bbs
      - name: shellcheck
        run: >-
          shellcheck src/nfsroot-watchdog src/nfsroot-watchdog-arm
          src/nfsroot-watchdog-check src/defaults debian/nfsroot-watchdog.default
          packaging/install-test.sh
      # The build adds an entry with the git-derived version to
      # debian/changelog; a local build's output must never be committed
      # (it pins a stale version and names a commit that may not exist).
      - name: debian/changelog is the placeholder
        run: grep -q '^  \* Placeholder changelog\.' debian/changelog
      - name: pytest
        run: |
          static=$(find /tmp/bbs -path '*/bin/busybox' -type f | head -n1)
          test -n "$static"
          export NFSROOT_WATCHDOG_TEST_BUSYBOX=/bin/busybox
          export NFSROOT_WATCHDOG_TEST_STATIC_BUSYBOX="$static"
          python3 -m pytest -v -rs tests/

  build-deb:
    name: build-deb (${{ matrix.suite }} ${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, forky, sid]
        arch: [all]
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + tags: the version is git describe's

      # The shared build: debian:<suite>, build deps from debian/control, and
      # the version from the shared deb-version.py (with ~deb<R>, and ~pr<P>
      # on a pull request). Writes the .debs to built-debs/.
      - name: Build
        uses: mithro/apt-repo-action/build-deb@docs/packaging-conventions  # TODO: @main once mithro/apt-repo-action#14 merges
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}

      # Install what was just built into a clean container of the same
      # suite: dependencies resolve, the units get enabled, the watchdog
      # stands down on a root that is not NFS, and arms and reacts to a
      # generation bump against a fake one. /run is mounted noexec, as
      # Debian's initramfs-tools mounts it on every initramfs-booted NFS
      # root; CAP_SYS_ADMIN (and no AppArmor mount denial) lets the arm
      # script mount its own tmpfs to execute from, as it does as root at
      # boot.
      - name: Install test
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            --tmpfs /run:rw,noexec,nosuid,nodev \
            -v "${PWD}/built-debs:/debs:ro" -v "${PWD}/packaging:/packaging:ro" \
            docker.io/library/debian:${{ matrix.suite }} \
            sh /packaging/install-test.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-debs/*.deb
          retention-days: 14

  publish-apt:
    # Build and install-test pull requests, but never publish from one (or
    # from any branch but main): that would overwrite the live repository
    # with unreviewed packages.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build-deb
    # Scoped to this job alone: the called workflow cannot exceed it.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "bookworm trixie forky sid"
      architectures: "all"
      description: "Reboot NFS-root clients whose root has changed underneath them"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
